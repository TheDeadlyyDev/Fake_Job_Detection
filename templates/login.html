{% extends "base.html" %}

{% block title %}Login - Fake Job Detection System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title"><i class="fas fa-sign-in-alt"></i> Login</h2>
        <p class="auth-subtitle">Sign in to your account</p>

        <form id="loginForm" method="POST" action="{{ url_for('login') }}" class="auth-form">
            <!-- User Type Selection -->
            <div class="form-group">
                <label class="form-label">Account Type</label>
                
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="user_type" value="employer" checked>
                        <span class="radio-label-text">Employer</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="user_type" value="admin">
                        <span class="radio-label-text">Admin</span>
                    </label>
                </div>
            </div>

            <!-- Username Field -->
            <div class="form-group">
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" 
                       id="username" 
                       name="username" 
                       class="form-input" 
                       placeholder="Enter your username or email"
                       required
                       autocomplete="username">
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" 
                       id="password" 
                       name="password" 
                       class="form-input" 
                       placeholder="Enter your password"
                       required
                       autocomplete="current-password">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block">Login</button>

            <!-- Register Link -->
            <div class="auth-footer">
                <p>Don't have an account? <a href="{{ url_for('register') }}" class="auth-link">Register as Employer</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
