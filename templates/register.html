{% extends "base.html" %}

{% block title %}Register - Fake Job Detection System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title"><i class="fas fa-user-plus"></i> Register as Employer</h2>
        <p class="auth-subtitle">Create your employer account</p>

        <form id="registerForm" method="POST" action="{{ url_for('register') }}" class="auth-form">
            <!-- Username Field -->
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" 
                       id="username" 
                       name="username" 
                       class="form-input" 
                       placeholder="Choose a username"
                       required
                       autocomplete="username"
                       minlength="3">
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       class="form-input" 
                       placeholder="Enter your email"
                       required
                       autocomplete="email">
            </div>

            <!-- Company Name Field -->
            <div class="form-group">
                <label for="company_name" class="form-label">Company Name</label>
                <input type="text" 
                       id="company_name" 
                       name="company_name" 
                       class="form-input" 
                       placeholder="Enter your company name"
                       required>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" 
                       id="password" 
                       name="password" 
                       class="form-input" 
                       placeholder="Create a password (min. 6 characters)"
                       required
                       autocomplete="new-password"
                       minlength="6">
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" 
                       id="confirm_password" 
                       name="confirm_password" 
                       class="form-input" 
                       placeholder="Confirm your password"
                       required
                       autocomplete="new-password"
                       minlength="6">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block">Register</button>

            <!-- Login Link -->
            <div class="auth-footer">
                <p>Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Login</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    // Password confirmation validation
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        
        if (password !== confirmPassword) {
            e.preventDefault();
            alert('Passwords do not match!');
            return false;
        }
    });
</script>
{% endblock %}
